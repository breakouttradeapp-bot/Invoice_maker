name: gst_invoice_maker
description: Professional GST Invoice Maker - India Compliant Offline App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^4.0.0
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # PDF Generation
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2

  # AdMob
  #google_mobile_ads: ^4.0.0

  # Image Picker
  image_picker: ^1.0.7
  image_cropper: ^5.0.1

  # File operations
  open_file: ^3.3.2
  share_plus: ^7.2.2
  permission_handler: ^11.3.0

  # Charts
  fl_chart: ^0.60.0
  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  number_to_words: ^1.0.0
  flutter_colorpicker: ^1.0.3
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/templates/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
